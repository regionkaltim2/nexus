<!DOCTYPE html>
<html lang="id" class="h-full light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Enterprise Application Portal</title>
    
    <!-- Favicon Inline (Mencegah 404) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#0F2747',
                            blue: '#2563EB',
                            'blue-hover': '#1D4ED8',
                            sky: '#0EA5E9',
                            bg: '#F6F8FB',
                            surface: '#FFFFFF',
                            border: '#E5EAF1',
                            text: '#172033',
                            muted: '#64748B',
                            success: '#10B981',
                            warning: '#F59E0B',
                            purple: '#6366F1'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    boxShadow: {
                        'subtle': '0 1px 2px 0 rgba(15, 23, 42, 0.03)',
                        'card': '0 2px 6px 0 rgba(15, 23, 42, 0.04), 0 1px 2px -1px rgba(15, 23, 42, 0.02)',
                        'card-hover': '0 12px 20px -4px rgba(37, 99, 235, 0.08), 0 4px 6px -2px rgba(15, 23, 42, 0.03)',
                        'popover': '0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04)'
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome 6 Icons & Google Fonts Inter -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Style File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F6F8FB] text-slate-900 min-h-screen flex flex-col relative selection:bg-blue-100 selection:text-blue-900">

    <!-- Header Navigation -->
    <header class="bg-white sticky top-0 z-30 border-b border-[#E5EAF1] px-4 sm:px-6 lg:px-8 h-16 flex items-center shadow-subtle">
        <div class="max-w-[1440px] w-full mx-auto flex items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="resetFilters()">
                <div class="w-8 h-8 rounded-xl bg-[#2563EB] text-white flex items-center justify-center font-bold text-base shadow-sm group-hover:bg-blue-700 ui-transition">
                    N
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-sm leading-tight tracking-tight">NEXUS</h1>
                    <p class="text-[11px] font-medium text-slate-400 tracking-tight">Enterprise Application Portal</p>
                </div>
            </div>

            <button onclick="playAudio('click'); openSpotlight()" class="hidden md:flex items-center space-x-3 bg-slate-50 hover:bg-slate-100/80 text-slate-400 hover:text-slate-600 px-3.5 py-1.5 rounded-xl border border-[#E5EAF1] ui-transition text-xs w-80 justify-between cursor-pointer">
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-[11px]"></i>
                    <span class="text-slate-400">Cari aplikasi, kata kunci, atau deskripsi...</span>
                </span>
                <kbd class="bg-white text-slate-400 px-1.5 py-0.5 rounded border border-slate-200 text-[10px] font-mono shadow-2xs">Ctrl + K</kbd>
            </button>

            <!-- Right Actions: Voice, Add Button & Clean Profile -->
            <div class="flex items-center space-x-3">
                <button id="voiceBtn" onclick="toggleVoiceRecognition()" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-600 font-medium rounded-xl text-xs flex items-center space-x-1.5 ui-transition border border-slate-200/80 shadow-2xs" title="Perintah Suara (Misal: 'Buka STNK')">
                    <i id="voiceMicIcon" class="fa-solid fa-microphone text-[12px]"></i>
                    <span id="voiceBtnText" class="hidden sm:inline">Perintah Suara</span>
                </button>

                <button onclick="playAudio('click'); openFormModal()" class="px-3.5 py-1.5 bg-[#2563EB] hover:bg-blue-700 text-white font-medium rounded-xl text-xs flex items-center space-x-1.5 ui-transition shadow-sm active:scale-98">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Tambah Aplikasi</span>
                </button>

                <div class="h-5 w-px bg-slate-200"></div>

                <div class="flex items-center space-x-2.5 pl-1 cursor-pointer group">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="User Avatar" class="w-8 h-8 rounded-full object-cover border border-slate-200">
                    <div class="hidden lg:block text-left">
                        <p class="text-xs font-semibold text-slate-800 leading-tight">Badar Hasyim</p>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-slate-600 ui-transition hidden sm:inline"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero / Page Header Section -->
    <section class="hero-bg border-b border-[#E5EAF1] py-7 relative overflow-hidden">
        <div class="absolute right-0 top-0 bottom-0 w-full lg:w-3/5 pointer-events-none opacity-25 lg:opacity-40 overflow-hidden mix-blend-multiply">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1200&auto=format&fit=crop" alt="Corporate Glass Architecture" class="w-full h-full object-cover object-right">
            <div class="absolute inset-0 bg-gradient-to-r from-[#EFF6FF] via-[#EFF6FF]/60 to-transparent"></div>
        </div>

        <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 relative z-10">
                <div class="space-y-1.5">
                    <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-600 text-[11px] font-semibold border border-blue-100 mb-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span id="backendStatus">Supabase Terhubung</span>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Portal Aplikasi</h2>
                    <p class="text-xs text-slate-500 font-medium max-w-xl leading-relaxed">
                        Akses seluruh aplikasi internal perusahaan dari satu tempat. Perintah suara aktif langsung di browser tanpa batas.
                    </p>
                </div>

                <div class="grid grid-cols-3 gap-3.5 w-full lg:w-auto">
                    <div class="bg-white p-3.5 rounded-2xl border border-[#E5EAF1] shadow-subtle flex items-center justify-between gap-5 min-w-[150px] hover:border-blue-300 ui-transition cursor-pointer" onclick="resetFilters()">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xs flex-shrink-0">
                                <i class="fa-solid fa-shapes"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-medium
